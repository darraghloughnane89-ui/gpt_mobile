name: Generate Release Version

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release or debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Build signed release or debug APK
        id: build
        env:
          APP_KEYSTORE: ${{ secrets.APP_KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./scripts/ci-assemble-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.mode }}-${{ github.sha }}
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload App Bundle
        if: steps.build.outputs.mode == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: release-aab-${{ github.sha }}
          path: ${{ steps.build.outputs.aab_path }}
          if-no-files-found: error
