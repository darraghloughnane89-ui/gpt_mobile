name: Emulator smoke

# Manual until one green run. GitHub-hosted ubuntu runners expose /dev/kvm;
# this agent VM does not, so the job is not on the pull_request path yet.
# After a green dispatch, add pull_request (branches-ignore: main).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Instrumented tests and launch
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./scripts/emulator-smoke.sh
