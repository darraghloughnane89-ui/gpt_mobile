name: Debug APK (non-main)

# Signed debug APKs for feature-branch work. PRs into main stay on
# debug-build.yml. This workflow does not use pull_request_target and does
# not comment on PRs, so a branch push cannot obtain a write token.
# assembleDebug is signed with the Android debug certificate that the
# Android Gradle Plugin generates on the runner. No keystore secret is used.

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build signed debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Confirm debug signature
        run: |
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner | sort | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
